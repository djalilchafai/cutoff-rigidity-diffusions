# Palomar mechanical preflight (advisory): runs Palomar's reusable verification workflow on the
# commit this workflow is dispatched on, for the submitted surface comparator-palomar.json.
# Manual trigger only: `gh workflow run palomar-preflight.yml --ref main`.
name: Palomar preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: cutcurpre001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator-palomar.json","authorization_relationship":"I am a responsible author or maintainer"}'
