fidelity:
  divergences: >-
    Brownian-free Euclidean statements (25 October 2026): 21 statements (wasserstein_cutoff_weak, information_cutoff_weak, langevin_w2_contraction, main_wasserstein_estimate, wasserstein_cutoff, information_cutoff, lp_cutoff, convex_interaction_cutoff, product_condition_cutoff, eigenmap_is_ou, mixing_time_rigid, mixing_time_w2_rigid, mixing_time_kl_rigid, ou_fisher_information, ou_mean_start_cutoff, ou_lp_infty_fails, langevin_entropy_decay, langevin_fisher_decay, langevin_fisher_dini, normalization_cutoff, temperature_cutoff) assume V in C^infinity instead of C^2 (inside IsEuclideanLangevin and IsSigmaLangevin; W_n in convex_interaction_cutoff), because uniqueness of the diffusion semigroup is proved for smooth potentials only. The diffusion is encoded by IsEuclideanDiffusion (Markov kernels, semigroup law, Kolmogorov/Dynkin identity on C_c^infty with generator Laplacian - grad V . grad); its uniqueness is proved (isEuclideanDiffusion_unique), not assumed, and Brownian motion is no longer a hypothesis of these statements. eigenmap_is_ou is stated in law form (the pushforward of Pt t x0 by the eigenmap is the Ornstein-Uhlenbeck marginal) instead of the pathwise equation with a Brownian beta. temperature_cutoff uses IsSigmaLangevin (generator sigma^2 Laplacian - grad V . grad). The remaining SDE-level statements (normalization_sde, temperature_sde, exists_stdBrownian, exists_langevin) keep Brownian motion as hypothesis.     Amendments in the additional statements: 0 < d is assumed where the formal objects are degenerate for d = 0 (spectral_gap_ge_curvature, mSpectralGap_ge_of_CD (finrank), ou_first_eigenspace, optimal_constants_extremal, langevin_entropy_decay, talagrand_logSobolev); optimal_lsi_twice_pi, optimal_constants_extremal and talagrand_logSobolev have no Brownian hypothesis; temperature_cd takes the smoothness of the standard metric of R^d as an instance argument; langevin_entropy_decay states the printed constants of the regularization inequality although the formalization proves a sharper one.     The diffusion of Theorem 1.9 is encoded by IsDiffusionSemigroup (Markov, semigroup law, Kolmogorov equation on C_c^infty); uniqueness of such semigroups under CD(rho,infty) is proved, not assumed. The paper-level development is incomplete. Any conditional transfer theorem
    or special case must be labelled as such and cannot replace the original
    statements in the final Comparator interface. The source audit reports an
    invalid inference from a curvature product condition to divergence of time
    in the archived proof of Theorem 1.7. The local target adds time divergence
    and explicit Riemannian completeness assumptions; its rigidity proof now
    explains how completeness gives the global flow used in splitting.
    These manuscript amendments are not new Lean proofs; see PAPER_AUDIT.md.
