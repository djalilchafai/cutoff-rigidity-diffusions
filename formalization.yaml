status:
  scope: >-
    Update 25 October 2026: all twelve Challenge theorems are proved in Solution.lean with only
    the standard axioms, and a sandboxed Comparator run accepts them. Theorem 1.9 (Riemannian Wasserstein estimate) is proved for every diffusion semigroup in the sense of IsDiffusionSemigroup, with no extra hypotheses.
    Historical scope notes follow. The full paper remains incomplete. The actual Euclidean Langevin process,
    measurable Brownian kernel, Markov semigroup and coupling contraction are
    constructed. Actual Gaussian projection laws, compact weak Bochner
    rigidity, compact weighted H¹ embedding, the nonnegative self-adjoint form
    operator, attained first gap and sharp Poincare are proved. At curvature
    equality, actual operator eigenfunctions have affine representatives and
    the full first eigenspace agrees with the classical one. Genuine Gibbs
    invariance of the constructed stochastic kernel is derived by its actual
    weak backward PDE and strong L² evolution, operator-domain identification,
    nonnegative-graph uniqueness and finite-measure equality on compact tests.
    The stochastic and canonical form semigroups agree on all Gibbs L², with
    equality of their full generator domains. The final Euclidean Wasserstein
    set/ball theorem uses the actual first gap, eigenspace and evaluation Lambda,
    with no supplied invariance or regularity premise. Wasserstein cutoff on
    balls about the actual barycenter and convex-interaction spectral/ball
    results are checked. Entropy/TV lower cutoffs, actual C¹ relative Fisher
    formulae, Fisher decay, density evolution and de Bruijn for normalized
    bounded-positive constant-plus-compact initial densities are proved.
    The full log-Sobolev inequality holds for arbitrary probability laws by
    actual closed-gradient approximation and Fatou. Fisher decay holds for
    every probability law. Full entropy-cost regularization for arbitrary laws
    follows from the genuine optimized-path logarithmic interpolation and
    compact C² entropy variational representation; actual positive-time Dirac
    transitions have finite entropy and genuine RN densities. Full entropy
    contraction and Fisher entropy-endpoint estimates use constructed finite-KL
    approximants. Euclidean information upper cutoffs and the fixed-curvature
    convex-interaction corollary on both source sets are proved. The full product-condition theorem packages all eight actual TV/H/I/W2
    cutoff limits, using actual varentropy, Salez window and Talagrand proofs.
    Full Gaussian product splitting identifies the actual first eigenspace
    dimension and normalized product in finite coordinates. The Lp extension and the Riemannian theorems are now proved (see the update above). Actual complete bounded global
    flows are C¹ diffeomorphisms; parallel gradient trajectories and the product
    homeomorphism are proved. No Euclidean result is advertised as the manifold
    theorem.
    Sixty-two results across ten proof streams pass Lean,
    NanoDa and con-ron replay. Full-paper Comparator and human semantic review
    remain outstanding. See verification/alignment.json for current scope.
