fidelity:
  divergences: >-
    The diffusion of Theorem 1.9 is encoded by IsDiffusionSemigroup (Markov, semigroup law, Kolmogorov equation on C_c^infty); uniqueness of such semigroups under CD(rho,infty) is proved, not assumed. The paper-level development is incomplete. Any conditional transfer theorem
    or special case must be labelled as such and cannot replace the original
    statements in the final Comparator interface. The source audit reports an
    invalid inference from a curvature product condition to divergence of time
    in the archived proof of Theorem 1.7. The local target adds time divergence
    and explicit Riemannian completeness assumptions; its rigidity proof now
    explains how completeness gives the global flow used in splitting.
    These manuscript amendments are not new Lean proofs; see PAPER_AUDIT.md.
