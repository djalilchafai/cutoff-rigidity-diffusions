    - lean: CutCur.exists_langevin  # non-vacuity of IsLangevin: assumes Hess V >= 0 (convexity, standing assumption) and probability Gibbs measure
    - lean: CutCur.isLangevinSolution_map_eq_kernel_of_rigid  # every SDE solution has the law prescribed by the kernel Pt (RigidCurvature version); makes the kernel formulation faithful
    - lean: CutCur.main_wasserstein_estimate
    - lean: CutCur.eigenspace_dim_and_lambda
    - lean: CutCur.wasserstein_cutoff
    - lean: CutCur.information_cutoff
    - lean: CutCur.lp_cutoff
    - lean: CutCur.convex_interaction
    - lean: CutCur.convex_interaction_cutoff
    - lean: CutCur.product_condition_cutoff
    - lean: CutCur.euclidean_gaussian_factorization
    - lean: CutCur.eigenmap_is_ou
    - lean: CutCur.eigenmap_is_ou_pathwise  # Lemma 3.3 in pathwise form: T(X) solves the OU SDE for a standard Brownian beta on the same space
    - lean: CutCur.wasserstein_cutoff_weak  # Remark 3.4
    - lean: CutCur.information_cutoff_weak  # Remark 3.5
    - lean: CutCur.spectral_gap_ge_curvature  # eq. (1.7), Lichnerowicz/Bakry-Emery, Euclidean
    - lean: CutCur.mSpectralGap_ge_of_CD  # Lichnerowicz/Bakry-Emery, weighted Riemannian manifolds (lines 619-627)
    - lean: CutCur.rigidity_of_gaussian_factor  # (R2) => (R1), Section 1.3
    - lean: CutCur.pairwise_interaction  # pairwise interaction example, after (1.5)
    - lean: CutCur.ou_first_eigenspace  # OU first eigenspace, after (1.4)
    - lean: CutCur.ou_mean_start_cutoff  # OU started from the mean, after Cor. 1.3
    - lean: CutCur.ou_lp_infty_fails  # p = infinity fails for OU, after (1.25)
    - lean: CutCur.mixing_time_rigid  # mixing time of rigid sequences, after Cor. 1.6 and product condition subsection (TV only)
    - lean: CutCur.mixing_time_w2_rigid  # W2 mixing time, summary after Cor. 1.6 (t0 -> infinity only under lambda_1 = o(log n))
    - lean: CutCur.mixing_time_kl_rigid  # entropy mixing time, summary after Cor. 1.6
    - lean: CutCur.langevin_moment_bounds  # moment bounds in the proofs of Thm 1.1, Cor. 1.3, 1.4
    - lean: CutCur.sup_eigenLambda_ball  # supremum of Lambda on balls, proof of Thm 1.1 and Cor. 1.3
    - lean: CutCur.langevin_w2_contraction  # W2 contraction for arbitrary initial laws, proof of Thm 1.1
    - lean: CutCur.langevin_entropy_decay  # entropy decay, regularization, Fisher bounds, proof of Cor. 1.4
    - lean: CutCur.langevin_fisher_decay  # eq:expdecI for every initial law, proof of Cor. 1.4
    - lean: CutCur.langevin_fisher_dini  # upper Dini form of dI/dt <= -2 rho I (toReal, I finite at t)
    - lean: CutCur.langevin_dissipation_eq_K'  # integrated de Bruijn identity (equality, eq. HI), finite entropy at an earlier time a < s
    - lean: CutCur.langevin_dissipation_eq_dirac_K  # integrated de Bruijn identity for a Dirac initial law (equality)
    - lean: CutCur.pinsker_tvDist  # Csiszar-Kullback-Pinsker, proof of Cor. 1.4
    - lean: CutCur.talagrand_logSobolev  # Talagrand and log-Sobolev, proof of Cor. 1.4
    - lean: CutCur.dyson_ou_static  # Dyson-OU example: static statement only (Gibbs law on the Weyl chamber, h = sum x_i, Neumann form, Poincare 1/rho, optimal over test functions); no Dyson-OU process (the spectral gap is dyson_spectralGap)
    - lean: CutCur.dyson_spectralGap  # Dyson-OU spectral gap lambda_1 = rho (Rayleigh infimum over C_c^infty, dysonGap) and H^1 approximation of the eigenfunction sum x_i
    - lean: CutCur.optimal_lsi_twice_pi  # subsection Optimal constants (no Brownian hypothesis)
    - lean: CutCur.optimal_constants_extremal  # subsection Optimal constants, extremal functions (amendment: 0 < d)
    - lean: CutCur.gaussian_isoperimetric_functional  # Gaussian isoperimetry, Bobkov functional form; QUADRATIC potential rho|x|^2/2 + c ONLY (not general Hess V >= rho; the manuscript only says CD(rho,infty) implies it)
    - lean: CutCur.gaussian_isoperimetric_sets  # Gaussian isoperimetry, set form (Sudakov-Tsirelson, Borell); quadratic potential only
    - lean: CutCur.gibbs_quadratic_isProb  # non-vacuity of the two Gaussian isoperimetric statements
    - lean: CutCur.rothaus_alternative_ne  # Rothaus remark, ABSTRACT Dirichlet-type form under the Compact hypothesis (compact-manifold theorem not proved)
    - lean: CutCur.two_optPI_le_optLSI  # 2 optPI <= optLSI for forms with an LSI
    - lean: CutCur.finite_rothaus  # discrete Rothaus alternative, unconditional (finite spaces; Saloff-Coste Th. 2.2.3)
    - lean: CutCur.ou_fisher_information  # Section 4.1, Fisher information of the OU heat kernel
    - lean: CutCur.heat_kernel_score  # Section 4.1, score of the heat kernel
    - lean: CutCur.normalization_cutoff  # Section 4.2, normalization (time-changed laws)
    - lean: CutCur.normalization_sde  # Section 4.2, normalization, SDE level (Brownian scaling; solutions given by hypothesis)
    - lean: CutCur.temperature_bakry_emery  # Section 4.4, temperature, Bakry-Emery operators
    - lean: CutCur.temperature_cd  # Section 4.4, temperature, CD condition (instance argument for the metric smoothness)
    - lean: CutCur.temperature_sde  # Section 4.4, temperature, SDE level and Gibbs invariance (adds Hess V >= rho > 0)
    - lean: CutCur.temperature_cutoff  # Section 4.4, temperature, cutoffs (hypothesis rho_n = sigma^2 spectralGap(V_n/sigma^2))
    - lean: CutCur.temperature_kernel  # Section 4.4, temperature, kernel form: existence, Gibbs invariance, uniqueness, time change (V in C^2, Hess V >= rho > 0 added)
    - lean: CutCur.bochner_identity  # Section 1.4, Bochner identity (scalar form)
    - lean: CutCur.carre_eq_operator  # Section 1.4, Gamma(f,g) = (L(fg) - fLg - gLf)/2
    - lean: CutCur.carre_polarization  # polarization of the carre du champ
    - lean: CutCur.generator_comp  # chain rule L(theta o f) = theta'(f) Lf + theta''(f) Gamma(f)
    - lean: CutCur.bochner_vector  # Section 1.4, Bochner formula in vector form (rough Laplacian computed with chart-constant frames)
    - lean: CutCur.CD_iff_ricci  # Section 1.4, CD(rho,infinity) iff Ric + Hess V >= rho g
    - lean: CutCur.riemannian_k1_bounds  # Section 1.4, 1 <= k1 <= dim M (needs hgap)
    - lean: CutCur.riemannian_poincare_lsi  # Section 1.4, Riemannian Poincare and log-Sobolev from CD(rho,infinity)
    - lean: CutCur.riemannian_wasserstein_estimate
    - lean: CutCur.riemannian_gaussian_splitting  # Thm 3.6 and Lemma 3.7, with the V o Phi^{-1} identity and connected, complete factor
    - lean: CutCur.sphere_curvature  # sphere: Ric = (d-1) g, CD(d-1,infty) and optimality, for any M isometrically immersed in S^d (IsSphereModel); concrete Sph d only in Extra
    - lean: CutCur.sphere_gap  # sphere: lambda_1 = d (d >= 2), hence != d-1; the sphere is NOT a witness of hgap in Thm 1.9

