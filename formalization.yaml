      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator-palomar.json
    - declaration: CutCur.lp_cutoff  # Display (1.25) (L^p cutoff, finite p)
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator-palomar.json
    - declaration: CutCur.convex_interaction  # Theorem 1.5 (convex interactions)
