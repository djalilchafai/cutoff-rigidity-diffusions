version: v0.4
project:
  name: Cutoff via rigidity for curved diffusions
  description: >-
    Work in progress towards a Lean formalization of Chafaï and Fathi,
    the local manuscript cutcur-lean.tex, based on arXiv:2412.15969v4.
    The target includes Wasserstein estimates, high-dimensional
    cutoff, rigidity, convex interactions, and Riemannian extensions. Current
    supporting results must not be read as proofs of these paper-level claims.
  authors: [Djalil Chafaï]
  responsible_maintainers: [Djalil Chafaï]
  license: Apache-2.0
classification:
  arxiv: [math.PR, math.DG]
  msc2020: ['60J60', '47D07', '53C21', '58J50']
sources:
  - title: On cutoff via rigidity for high-dimensional curved diffusions
    authors: [Djalil Chafaï, Max Fathi]
    id: arXiv:2412.15969v4
    type: paper
    location: https://arxiv.org/abs/2412.15969v4
    relationship: formalizes
    note: >-
      Background source: the 24 March 2026 postpublication revision.
      The current formalization target is the local manuscript cutcur-lean.tex,
      which adds a time-divergence hypothesis to Theorem 1.7 and explicitly
      assumes complete, connected manifolds without boundary for the
      Riemannian results. PAPER_AUDIT.md records the archived-source audit
      and the local completeness correction. Formalization is incomplete;
      see PALOMAR.md.
    license: CC-BY-4.0
related_formalizations:
  - id: https://github.com/RemyDegenne/brownian-motion
    relationship: adapts
    note: >-
      Degenne, Ledvinka, Marion, Pfaffelhuber, Formalization of Brownian motion in Lean (arXiv:2511.20118).
      The 26 modules of the Gaussian, Continuity and Auxiliary closure of BrownianMotion.Gaussian.BrownianMotion
      (commit 546d77295fdf8ae7f44cec14ec5df7959c4e3617) are vendored under vendor/brownian-motion with minimal
      porting patches (3 added lines in IsKolmogorovProcess.lean, 1 dropped `.aemeasurable` in KolmogorovChentsov.lean; see vendor/README.md).
      Apache-2.0. Used only to prove CutCur.exists_stdBrownian and CutCur.exists_langevin.
  - id: https://github.com/RemyDegenne/kolmogorov_extension4
    relationship: adapts
    note: >-
      Kolmogorov extension theorem (3 modules, commit c20f168ed693537c78111ffeabc2ab5f384e35d6) vendored under
      vendor/kolmogorov_extension4, with one added import line in CompactSystem.lean and the added Mathlib backport
      module Compat/CompactSystemExtra.lean (vendor/README.md). Apache-2.0.
status:
  scope: >-
    Update 25 October 2026 (Brownian-free Euclidean statements): eighteen Euclidean Challenge statements (main_wasserstein_estimate, wasserstein_cutoff, information_cutoff, lp_cutoff, convex_interaction_cutoff, product_condition_cutoff, eigenmap_is_ou, mixing_time_rigid, mixing_time_w2_rigid, mixing_time_kl_rigid, ou_fisher_information, ou_mean_start_cutoff, ou_lp_infty_fails, langevin_entropy_decay, langevin_fisher_decay, langevin_fisher_dini, normalization_cutoff, temperature_cutoff) were replaced by kernel statements without Brownian motion (IsEuclideanDiffusion, IsEuclideanLangevin, IsSigmaLangevin, worstK, mixingTimeK, IsRigidSequenceK); still 48 theorems, proofs in Solution.lean via aliases of the kernel theorems. Not yet re-run through Comparator; not audited by AI or human after this change.
    Update 25 October 2026 (Brownian existence): Challenge.lean now also states exists_stdBrownian (a standard Brownian motion on R^d exists on some probability space) and exists_langevin (for C^2 V with Hess V >= 0 and probability Gibbs measure, IsLangevin V B P X holds for some space, B, P, X), 48 theorems in all, proved in Solution.lean with only the standard axioms. The standing hypothesis IsLangevin of every Langevin statement is therefore shown satisfiable (for convex V, the paper's standing assumption). The proof vendors the Brownian motion library of Degenne, Ledvinka, Marion and Pfaffelhuber (vendor/, Apache-2.0, with minimal porting patches; see vendor/README.md). Brownian existence is no longer in the not-formalized list. Not yet run through Comparator after this extension.
    Update 25 October 2026 (cheap block): Challenge.lean now states 46 theorems and 51 definitions: 11 further statements (Bochner identity and CD iff Ric + Hess V >= rho, Riemannian k1 bounds, Riemannian Poincare and log-Sobolev, Fisher decay for all initial laws and its Dini form, Brownian scaling at the SDE level, temperature SDE and cutoffs, W2 and entropy mixing times), all proved in Solution.lean with only the standard axioms; `entropyOf` is now stated on any measurable space. Divergences flagged in the docstrings: temperature_sde adds Hess V >= rho > 0; temperature_cutoff takes rho_n = sigma^2 spectralGap(V_n/sigma^2) as hypothesis; the last conjunct of mixing_time_w2_rigid is an implication (t0 -> infinity only under lambda_1 = o(log n)); riemannian_k1_bounds needs the gap hypothesis; solutions of SDEs and Brownian motions are given by hypothesis; the Dini form is stated on toReal at times with finite Fisher information. Not formalized: Question 1.10 (open), eq:loggradbound (conjectural), dH/dt = -I for general laws, Theorem 1.7 on manifolds, sphere, Dyson, Gaussian isoperimetry, Brownian existence, Leibniz identity for the carre du champ, vector-form Bochner, the Rothaus remark. Not yet run through Comparator after this extension.
    Update 25 October 2026 (later): Challenge.lean then stated 34 theorems (the 12 above plus 22 further manuscript claims: Remarks 3.4 and 3.5, the Lichnerowicz bound and (R2) => (R1), examples, proof ingredients and Section 4 items), all proved in Solution.lean with only the standard axioms. The splitting theorem now also states the potential identity and the connectedness and completeness of the factor. (Superseded list of non-formalized items: see the cheap block update above.)
    Update 25 October 2026: all twelve Challenge theorems are proved in Solution.lean with only
    the standard axioms, and a sandboxed Comparator run accepts them. Theorem 1.9 (Riemannian Wasserstein estimate) is proved for every diffusion semigroup in the sense of IsDiffusionSemigroup, with no extra hypotheses.
    Historical scope notes follow. The full paper remains incomplete. The actual Euclidean Langevin process,
    measurable Brownian kernel, Markov semigroup and coupling contraction are
    constructed. Actual Gaussian projection laws, compact weak Bochner
    rigidity, compact weighted H¹ embedding, the nonnegative self-adjoint form
    operator, attained first gap and sharp Poincare are proved. At curvature
    equality, actual operator eigenfunctions have affine representatives and
    the full first eigenspace agrees with the classical one. Genuine Gibbs
    invariance of the constructed stochastic kernel is derived by its actual
    weak backward PDE and strong L² evolution, operator-domain identification,
    nonnegative-graph uniqueness and finite-measure equality on compact tests.
    The stochastic and canonical form semigroups agree on all Gibbs L², with
    equality of their full generator domains. The final Euclidean Wasserstein
    set/ball theorem uses the actual first gap, eigenspace and evaluation Lambda,
    with no supplied invariance or regularity premise. Wasserstein cutoff on
    balls about the actual barycenter and convex-interaction spectral/ball
    results are checked. Entropy/TV lower cutoffs, actual C¹ relative Fisher
    formulae, Fisher decay, density evolution and de Bruijn for normalized
    bounded-positive constant-plus-compact initial densities are proved.
    The full log-Sobolev inequality holds for arbitrary probability laws by
    actual closed-gradient approximation and Fatou. Fisher decay holds for
    every probability law. Full entropy-cost regularization for arbitrary laws
    follows from the genuine optimized-path logarithmic interpolation and
    compact C² entropy variational representation; actual positive-time Dirac
    transitions have finite entropy and genuine RN densities. Full entropy
    contraction and Fisher entropy-endpoint estimates use constructed finite-KL
    approximants. Euclidean information upper cutoffs and the fixed-curvature
    convex-interaction corollary on both source sets are proved. The full product-condition theorem packages all eight actual TV/H/I/W2
    cutoff limits, using actual varentropy, Salez window and Talagrand proofs.
    Full Gaussian product splitting identifies the actual first eigenspace
    dimension and normalized product in finite coordinates. The Lp extension and the Riemannian theorems are now proved (see the update above). Actual complete bounded global
    flows are C¹ diffeomorphisms; parallel gradient trajectories and the product
    homeomorphism are proved. No Euclidean result is advertised as the manifold
    theorem.
    Sixty-two results across ten proof streams pass Lean,
    NanoDa and con-ron replay. Full-paper Comparator and human semantic review
    remain outstanding. See verification/alignment.json for current scope.
