# Proposed Palomar surface: PalomarChallenge.lean with comparator-palomar.json (reviewed by the author, see review).
# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: Cutoff via rigidity for curved diffusions
  description: >-
    Lean 4 formalization of Chafaï and Fathi, "On cutoff via rigidity for high
    dimensional curved diffusions" (Comptes Rendus Mathématique 363 (2025)
    1103-1121), in the corrected version arXiv:2412.15969v5. The submitted
    statement surface PalomarChallenge.lean (Comparator configuration
    comparator-palomar.json) states the numbered results of the paper
    (Theorems 1.1, 1.5, 1.7, 1.9, 3.1, 3.6, Corollaries 1.3, 1.4, 1.6, Lemma 3.3,
    Remark 1.2, display (1.25)), the identification of the transition kernel
    with the law of the SDE solution, and the existence of the diffusion and of
    SDE solutions for convex potentials (non-vacuity of the standing
    hypotheses) and the uniqueness of the kernel: 16 theorems. The repository also contains a larger surface,
    Challenge.lean with comparator.json (69 theorems: remarks, examples and
    Section 4 as well). Both are proved with the standard axioms only. Some statements are restricted or
    amended; every difference with arXiv v5 is listed in fidelity.divergences.
  authors: [Djalil Chafaï]
  responsible_maintainers: [Djalil Chafaï]
  license: Apache-2.0
classification:
  arxiv: [math.PR, math.DG]
  msc2020: ['60J60', '47D07', '53C21', '58J50']
sources:
  - title: On cutoff via rigidity for high dimensional curved diffusions
    authors: [Djalil Chafaï, Max Fathi]
    id: arXiv:2412.15969v5
    type: article
    location: https://arxiv.org/abs/2412.15969v5
    relationship: formalizes
    author_endorsement: participated
    note: >-
      Post-publication version of 25 October 2026 of the article published in
      Comptes Rendus Mathématique 363 (2025) 1103-1121, doi:10.5802/crmath.776.
      It includes the corrections listed in the erratum to the published
      article: L^p cutoff for finite p only (it fails for p = infinity),
      additional hypotheses in Theorem 1.7 (the printed version is false, see
      PAPER_AUDIT.md), and complete connected manifolds without boundary in the
      Riemannian results. The numbering of results is the same in v4 and v5.
      The TeX source is archived in paper/ (SHA-256 in paper/SOURCE.txt);
      cutcur-lean.tex is the same text with a BibTeX bibliography. Source-author
      involvement: D. Chafaï, co-author, is the maintainer of this formalization and
      reviewed the statements of the submitted surface; M. Fathi, co-author, was
      informed and agreed to the registration (20 November 2026).
    license: CC-BY-4.0
related_formalizations:
  - id: https://github.com/RemyDegenne/brownian-motion
    relationship: adapts
    note: >-
      Degenne, Ledvinka, Marion, Pfaffelhuber, Formalization of Brownian motion in Lean (arXiv:2511.20118).
      The 26 modules of the Gaussian, Continuity and Auxiliary closure of BrownianMotion.Gaussian.BrownianMotion
      (commit 546d77295fdf8ae7f44cec14ec5df7959c4e3617) are vendored under vendor/brownian-motion with minimal
      porting patches (3 added lines in IsKolmogorovProcess.lean, 1 dropped `.aemeasurable` in KolmogorovChentsov.lean; see vendor/README.md).
      Apache-2.0. Used only to prove CutCur.exists_stdBrownian and CutCur.exists_langevin.
  - id: https://github.com/RemyDegenne/kolmogorov_extension4
    relationship: adapts
    note: >-
      Kolmogorov extension theorem (3 modules, commit c20f168ed693537c78111ffeabc2ab5f384e35d6) vendored under
      vendor/kolmogorov_extension4, with one added import line in CompactSystem.lean and the added Mathlib backport
      module Compat/CompactSystemExtra.lean (vendor/README.md). Apache-2.0.
status:
  scope: >-
    Two Comparator surfaces, both built from Mathlib-only definitions.
    PalomarChallenge.lean (335 lines, 16 theorems, 41 definitions;
    comparator-palomar.json) is generated verbatim from Challenge.lean by
    scripts/gen-palomar.py and is the surface proposed for registration.
    Challenge.lean (860 lines, 69 theorems, 67 definitions; comparator.json) is
    the full surface. PalomarSolution.lean and Solution.lean prove every theorem
    with exactly the Challenge type; the sandboxed lake comparator accepts both
    pairs (Lean kernel, nanoda, con-ron; verification/comparator-palomar-sandboxed.log
    and verification/comparator-sandboxed.log). Covered by the full surface:
    the Euclidean results of Section 1 (Theorem 1.1, Remark 1.2,
    Corollaries 1.3 and 1.4, display (1.25), Theorem 1.5, Corollary 1.6,
    Theorem 1.7), the Riemannian results (Theorem 1.9, Theorem 3.6 with Lemma
    3.7, Bochner identity, CD(rho,infty) iff Ric + Hess V >= rho, k_1 bounds,
    Lichnerowicz, Poincaré and log-Sobolev), Section 3 (Theorem 3.1, Lemma 3.3
    in law and pathwise form, Remarks 3.4 and 3.5), the examples and proof
    ingredients (Ornstein-Uhlenbeck, pairwise interaction, moment bounds,
    Wasserstein contraction, entropy and Fisher decay, integrated de Bruijn
    identity, Pinsker, Talagrand, optimal constants, static Dyson-OU and its
    spectral gap, carré du champ identities) and Section 4 (normalization,
    temperature, Fisher information of the OU heat kernel), plus existence of
    Brownian motion and of the Langevin diffusion. Not formalized: Question
    1.10 (open) and the conjectural bound eq:loggradbound; Theorem 1.7 on
    manifolds (no precise statement in the paper); the Dyson-OU process itself;
    Gaussian isoperimetry beyond the quadratic potential; the Rothaus remark on
    compact manifolds (only an abstract form and finite spaces); the concrete
    round sphere (only a model form). Details: README.md, section "What is not
    formalized", and PALOMAR.md.
