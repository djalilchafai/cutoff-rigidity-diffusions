        Palomar scaffolding and an independent statement-fidelity audit. Local Lean kernel checking,
        lake comparator inside bwrap (see PALOMAR.md), con-ron and nanoda.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: local Linux environment and model API
      prompting_notes: >-
        The owner asked for full formalization of every Challenge statement using agents, then
        for removal of the extra diffusion hypotheses that an intermediate version carried.
    - method: agent
      models: [claude-opus-5-5]
      framework: Claude Code
      tool_setup: >-
        Single session with one auditing subagent: metadata update to the reference
        version arXiv:2412.15969v5, consistency of the documentation, AI audit of the
        statements added on 1 November 2026 (verification/audit-extra-N.md), schema
        validation of this file, rebuild and sandboxed Comparator rerun.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
        hardware: local Linux environment and model API
      prompting_notes: >-
        The owner asked to use arXiv v5 as the reference and to repair the
        inconsistencies found in a Palomar-readiness review.
  spend_usd: not tracked
  notes: >-
    AI contributions are recorded here, not as human authorship. The human
    review is recorded under review below; the AI agents asserted none.
fidelity:
  divergences: >-
    Reference: arXiv:2412.15969v5. Differences between the Lean statements and v5.
    (1) Encoding of the diffusion. The Euclidean statements are stated for transition
    kernels: IsEuclideanDiffusion (Markov kernels, semigroup law, Dynkin identity on
    C_c^infty with generator Laplacian - grad V . grad), IsEuclideanLangevin (adds V in C^2
    and a probability Gibbs measure), IsSigmaLangevin (generator sigma^2 Laplacian - grad V
    . grad). Uniqueness of such kernels is proved for convex C^2 V
    (euclideanDiffusion_unique_of_convex), it exists
    (exists_euclideanLangevin_of_convex), and isLangevinSolution_map_eq_kernel_of_convex
    proves that Pt t x is the law at time t of any solution of the SDE (1.1), for every
    convex C^2 V. Every kernel statement assumes convexity, so the kernel form is
    equivalent to the SDE form of the paper; this is not so for the sigma-diffusion of
    Section 4 (IsSigmaLangevin) with sigma different from 1, whose SDE identification is
    not a statement.
    Every statement using these predicates assumes convexity (Hess V >= 0 or stronger,
    as in the paper's standing assumptions). Theorem 1.9 encodes the diffusion as
    IsDiffusionSemigroup (Markov kernels, semigroup law, Kolmogorov equation on
    C_c^infty); uniqueness under CD(rho,infty) is proved, not assumed.
    (2) SDE-level statements (normalization_sde, temperature_sde, eigenmap_is_ou_pathwise,
    exists_langevin) take Brownian motions and SDE solutions as hypotheses or produce
    them; exists_stdBrownian and exists_langevin (Hess V >= 0) show these hypotheses are
    satisfiable. Lemma 3.3 is stated in law form (eigenmap_is_ou) and in pathwise form
    without a filtration statement for the Brownian motion (eigenmap_is_ou_pathwise).
    (3) Added hypotheses not in v5: 0 < d or 0 < finrank where the formal objects are
    degenerate in dimension 0; hgap (lambda_1 = rho) in riemannian_k1_bounds, without
    which the bounds fail on spheres; Hess V >= rho > 0 in temperature_sde and
    temperature_kernel; rho_n = sigma^2 lambda_1(V_n/sigma^2) as hypothesis in
    temperature_cutoff; finite entropy at an earlier time in langevin_dissipation_eq_K'.
    Theorem 3.6 also states the potential identity V o Phi^-1 and that the factor is
    connected and complete.
    (4) Restricted scope: Gaussian isoperimetry for the quadratic potential only
    (gaussian_isoperimetric_functional, gaussian_isoperimetric_sets); the Rothaus
    alternative for an abstract Dirichlet-type form under the hypothesis Form.Compact
    and for finite spaces (rothaus_alternative_ne, finite_rothaus), not for compact
    manifolds; the sphere in model form (IsSphereModel: isometric immersion into S^d;
    sphere_curvature, sphere_gap); Dyson-OU static statement and spectral gap only
    (dyson_ou_static, dyson_spectralGap, the latter with its own definition dysonGap);
    the last conjunct of mixing_time_w2_rigid is an implication; langevin_fisher_dini
    is stated on toReal at times with finite Fisher information; langevin_entropy_decay
    states the constants of the paper although a sharper inequality is proved.
    (5) Junk values of total definitions: spectralGap and mSpectralGap use sInf (0 on
    the empty set), mixingTimeKLK uses an infimum (top on the empty set), fisherInfo,
    wasserstein2 and entropyOf take conventional values outside their natural domain;
    the hypotheses of each statement exclude the degenerate cases (see the docstrings).
    mRic is the Ricci tensor with the sign convention positive on spheres.
    (6) Corrections of the published article (CRAS 2025) that are part of v5 and of
    its erratum, and hence of the Lean statements: Theorem 1.7 with liminf kappa > 0
    and t_0 -> infinity for the Wasserstein and Fisher conclusions (the published
    statement fails for the Ornstein-Uhlenbeck process; the counterexample is a written
    derivation in PAPER_AUDIT.md, not checked in Lean); display (1.25) for finite p
    (ou_lp_infty_fails proves that p = infinity fails); complete connected manifolds
    without boundary in the Riemannian results.
review:
  status: author-verified
  reviewers: [Djalil Chafaï]
  notes: >-
    Scope of the human review: the 16 statements of the submitted surface
    PalomarChallenge.lean (comparator-palomar.json) and the definitions they use
    were checked against arXiv:2412.15969v5 by Djalil Chafaï, co-author of the paper,
    on 20 November 2026. The other 53 statements of the full surface Challenge.lean
    have had AI audits only. Every Challenge statement has been
    audited against the paper by at least one AI agent (verification/semantic-audit.md,
    audit-second-1.md, audit-second-2.md, audit-extra-A.md to audit-extra-O.md); these
    audits cover statements and definitions, not proofs (which are kernel-checked).
    The checklist for a human review is HUMAN_REVIEW.md, summarized in
    HUMAN_REVIEW_SUMMARY.md.
alignment:
  namespace: CutoffRigidity
  statements:
    - lean: CutCur.exists_stdBrownian  # existence of a standard Brownian motion on R^d (vendored Degenne et al. library; Mathlib IsBrownianReal)
    - lean: CutCur.exists_langevin  # non-vacuity of IsLangevin: assumes Hess V >= 0 (convexity, standing assumption) and probability Gibbs measure
    - lean: CutCur.isLangevinSolution_map_eq_kernel_of_convex  # every SDE solution has the law prescribed by the kernel Pt, for convex C^2 V; makes the kernel formulation faithful
    - lean: CutCur.exists_euclideanLangevin_of_convex  # non-vacuity of IsEuclideanLangevin: the kernel exists for convex C^2 V with probability Gibbs measure
    - lean: CutCur.euclideanDiffusion_unique_of_convex  # uniqueness of the kernel in IsEuclideanDiffusion for convex C^2 V
    - lean: CutCur.main_wasserstein_estimate
    - lean: CutCur.eigenspace_dim_and_lambda
    - lean: CutCur.wasserstein_cutoff
    - lean: CutCur.information_cutoff
    - lean: CutCur.lp_cutoff
    - lean: CutCur.convex_interaction
    - lean: CutCur.convex_interaction_cutoff
    - lean: CutCur.product_condition_cutoff
    - lean: CutCur.euclidean_gaussian_factorization
    - lean: CutCur.eigenmap_is_ou
    - lean: CutCur.eigenmap_is_ou_pathwise  # Lemma 3.3 in pathwise form: T(X) solves the OU SDE for a standard Brownian beta on the same space
    - lean: CutCur.wasserstein_cutoff_weak  # Remark 3.4
    - lean: CutCur.information_cutoff_weak  # Remark 3.5
    - lean: CutCur.spectral_gap_ge_curvature  # eq. (1.7), Lichnerowicz/Bakry-Emery, Euclidean
    - lean: CutCur.mSpectralGap_ge_of_CD  # Lichnerowicz/Bakry-Emery, weighted Riemannian manifolds (lines 619-627)
    - lean: CutCur.rigidity_of_gaussian_factor  # (R2) => (R1), Section 1.3
    - lean: CutCur.pairwise_interaction  # pairwise interaction example, after (1.5)
    - lean: CutCur.ou_first_eigenspace  # OU first eigenspace, after (1.4)
    - lean: CutCur.ou_mean_start_cutoff  # OU started from the mean, after Cor. 1.3
    - lean: CutCur.ou_lp_infty_fails  # p = infinity fails for OU, after (1.25)
    - lean: CutCur.mixing_time_rigid  # mixing time of rigid sequences, after Cor. 1.6 and product condition subsection (TV only)
    - lean: CutCur.mixing_time_w2_rigid  # W2 mixing time, summary after Cor. 1.6 (t0 -> infinity only under lambda_1 = o(log n))
    - lean: CutCur.mixing_time_kl_rigid  # entropy mixing time, summary after Cor. 1.6
    - lean: CutCur.langevin_moment_bounds  # moment bounds in the proofs of Thm 1.1, Cor. 1.3, 1.4
    - lean: CutCur.sup_eigenLambda_ball  # supremum of Lambda on balls, proof of Thm 1.1 and Cor. 1.3
    - lean: CutCur.langevin_w2_contraction  # W2 contraction for arbitrary initial laws, proof of Thm 1.1
    - lean: CutCur.langevin_entropy_decay  # entropy decay, regularization, Fisher bounds, proof of Cor. 1.4
    - lean: CutCur.langevin_fisher_decay  # eq:expdecI for every initial law, proof of Cor. 1.4
    - lean: CutCur.langevin_fisher_dini  # upper Dini form of dI/dt <= -2 rho I (toReal, I finite at t)
    - lean: CutCur.langevin_dissipation_eq_K'  # integrated de Bruijn identity (equality, eq. HI), finite entropy at an earlier time a < s
    - lean: CutCur.langevin_dissipation_eq_dirac_K  # integrated de Bruijn identity for a Dirac initial law (equality)
    - lean: CutCur.pinsker_tvDist  # Csiszar-Kullback-Pinsker, proof of Cor. 1.4
    - lean: CutCur.talagrand_logSobolev  # Talagrand and log-Sobolev, proof of Cor. 1.4
    - lean: CutCur.dyson_ou_static  # Dyson-OU example: static statement only (Gibbs law on the Weyl chamber, h = sum x_i, Neumann form, Poincare 1/rho, optimal over test functions); no Dyson-OU process (the spectral gap is dyson_spectralGap)
    - lean: CutCur.dyson_spectralGap  # Dyson-OU spectral gap lambda_1 = rho (Rayleigh infimum over C_c^infty, dysonGap) and H^1 approximation of the eigenfunction sum x_i
    - lean: CutCur.optimal_lsi_twice_pi  # subsection Optimal constants (no Brownian hypothesis)
    - lean: CutCur.optimal_constants_extremal  # subsection Optimal constants, extremal functions (amendment: 0 < d)
    - lean: CutCur.gaussian_isoperimetric_functional  # Gaussian isoperimetry, Bobkov functional form; QUADRATIC potential rho|x|^2/2 + c ONLY (not general Hess V >= rho; the manuscript only says CD(rho,infty) implies it)
    - lean: CutCur.gaussian_isoperimetric_sets  # Gaussian isoperimetry, set form (Sudakov-Tsirelson, Borell); quadratic potential only
    - lean: CutCur.gibbs_quadratic_isProb  # non-vacuity of the two Gaussian isoperimetric statements
    - lean: CutCur.rothaus_alternative_ne  # Rothaus remark, ABSTRACT Dirichlet-type form under the Compact hypothesis (compact-manifold theorem not proved)
    - lean: CutCur.two_optPI_le_optLSI  # 2 optPI <= optLSI for forms with an LSI
    - lean: CutCur.finite_rothaus  # discrete Rothaus alternative, unconditional (finite spaces; Saloff-Coste Th. 2.2.3)
    - lean: CutCur.ou_fisher_information  # Section 4.1, Fisher information of the OU heat kernel
    - lean: CutCur.heat_kernel_score  # Section 4.1, score of the heat kernel
    - lean: CutCur.normalization_cutoff  # Section 4.2, normalization (time-changed laws)
    - lean: CutCur.normalization_sde  # Section 4.2, normalization, SDE level (Brownian scaling; solutions given by hypothesis)
    - lean: CutCur.temperature_bakry_emery  # Section 4.4, temperature, Bakry-Emery operators
    - lean: CutCur.temperature_cd  # Section 4.4, temperature, CD condition (instance argument for the metric smoothness)
    - lean: CutCur.temperature_sde  # Section 4.4, temperature, SDE level and Gibbs invariance (adds Hess V >= rho > 0)
    - lean: CutCur.temperature_cutoff  # Section 4.4, temperature, cutoffs (hypothesis rho_n = sigma^2 spectralGap(V_n/sigma^2))
    - lean: CutCur.temperature_kernel  # Section 4.4, temperature, kernel form: existence, Gibbs invariance, uniqueness, time change (V in C^2, Hess V >= rho > 0 added)
    - lean: CutCur.bochner_identity  # Section 1.4, Bochner identity (scalar form)
    - lean: CutCur.carre_eq_operator  # Section 1.4, Gamma(f,g) = (L(fg) - fLg - gLf)/2
    - lean: CutCur.carre_polarization  # polarization of the carre du champ
    - lean: CutCur.generator_comp  # chain rule L(theta o f) = theta'(f) Lf + theta''(f) Gamma(f)
    - lean: CutCur.bochner_vector  # Section 1.4, Bochner formula in vector form (rough Laplacian computed with chart-constant frames)
    - lean: CutCur.CD_iff_ricci  # Section 1.4, CD(rho,infinity) iff Ric + Hess V >= rho g
    - lean: CutCur.riemannian_k1_bounds  # Section 1.4, 1 <= k1 <= dim M (needs hgap)
    - lean: CutCur.riemannian_poincare_lsi  # Section 1.4, Riemannian Poincare and log-Sobolev from CD(rho,infinity)
    - lean: CutCur.riemannian_wasserstein_estimate
    - lean: CutCur.riemannian_gaussian_splitting  # Thm 3.6 and Lemma 3.7, with the V o Phi^{-1} identity and connected, complete factor
    - lean: CutCur.sphere_curvature  # sphere: Ric = (d-1) g, CD(d-1,infty) and optimality, for any M isometrically immersed in S^d (IsSphereModel); concrete Sph d only in Extra
    - lean: CutCur.sphere_gap  # sphere: lambda_1 = d (d >= 2), hence != d-1; the sphere is NOT a witness of hgap in Thm 1.9

